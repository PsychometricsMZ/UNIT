[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpmdeep"
version = "0.1.0"
description = "Deep CATE estimation for two-stage mediation analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Roberto Faleh" },
]
dependencies = [
    "numpy>=1.20,<2.0",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "jax>=0.3.16,<0.5",
    "jaxlib>=0.3.14,<0.5",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "tqdm>=4.62",
    "joblib>=1.1",
    # Vendored CATENets (third_party/catenets) runtime requirements
    "loguru>=0.5.3",
    "gdown>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
